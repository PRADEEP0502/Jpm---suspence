<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>JPM Suspense Amount Dashboard</title>
    <meta name="description" content="Track amounts given out that are pending settlement, and their closing history." />
    <link rel="icon" type="image/png" href="icons/favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f4ead8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JPM Suspense" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Fetch every script at once instead of one import after another (each round trip costs time). -->
    <link rel="modulepreload" href="js/app.js" />
    <link rel="modulepreload" href="js/lib.js" />
    <link rel="modulepreload" href="js/state.js" />
    <link rel="modulepreload" href="js/ui.js" />
    <link rel="modulepreload" href="js/dialogs.js" />
    <link rel="modulepreload" href="js/entry-list.js" />
    <link rel="modulepreload" href="js/pages/login.js" />
    <link rel="modulepreload" href="js/pages/dashboard.js" />
    <link rel="modulepreload" href="js/pages/all.js" />
    <link rel="modulepreload" href="js/pages/add.js" />
    <link rel="modulepreload" href="js/pages/closed.js" />
    <link rel="modulepreload" href="js/pages/persons.js" />
    <link rel="modulepreload" href="js/pages/my.js" />
    <link rel="modulepreload" href="js/pages/myhistory.js" />
    <link rel="modulepreload" href="js/pages/profile.js" />
    <link rel="modulepreload" href="js/pages/users.js" />
    <link rel="modulepreload" href="js/pages/permissions.js" />
    <link rel="modulepreload" href="js/pages/reports.js" />
    <link rel="modulepreload" href="js/pages/settings.js" />
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <img src="icons/app-icon.png" alt="" width="132" height="132" />
      <div class="splash-title">JPM Suspense</div>
      <div class="splash-sub">Junior Processing Mill</div>
    </div>
    <a class="skip-link" href="#app">Skip to content</a>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/dashboard">
          <img class="brand-logo" src="icons/logo.png" alt="Junior Processing Mill" width="44" height="44" />
          <span class="brand-text">
            <span class="brand-title">JPM Suspense Amount Dashboard</span>
            <span class="brand-sub"><span id="asOf"></span> <span id="liveStatus" class="live-chip"></span></span>
          </span>
        </a>
        <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav" hidden>
          <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
        </button>
        <div class="user-area" id="userArea"></div>
      </div>
    </header>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <main id="app" class="container" tabindex="-1"><div class="empty empty--tall">Loading…</div></main>
    <div id="modalRoot"></div>
    <div id="toastRoot" class="toasts" aria-live="polite"></div>
    <noscript><p class="container">This application needs JavaScript enabled in the browser.</p></noscript>
    <script type="module" src="js/app.js"></script>
    <script src="js/pwa.js"></script>
  </body>
</html>
